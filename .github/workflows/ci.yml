name: ci
run-name: ci / ${{ github.event_name }} / ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && github.event.inputs.profile || github.event_name == 'pull_request' && 'standard' || 'fast' }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "CI profile to run"
        required: true
        default: standard
        type: choice
        options:
          - fast
          - standard
          - full
      test_shards_total:
        description: "Workspace test shard count (1 disables sharding)"
        required: true
        default: "1"
        type: string
      test_shard_index:
        description: "Workspace test shard index (0-based)"
        required: true
        default: "0"
        type: string
      gpu_pack:
        description: "Optional self-hosted GPU pack required by this full run"
        required: true
        default: none
        type: choice
        options:
          - none
          - primary
          - matrix
  schedule:
    - cron: "0 8 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gpu_runner_preflight:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GENESIS_GPU_PACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.gpu_pack || github.event_name == 'schedule' && vars.GENESIS_GPU_SCHEDULE_PACK || 'none' }}
    outputs:
      overall_status: ${{ steps.classify.outputs.overall_status }}
      primary_linux_status: ${{ steps.classify.outputs.primary_linux_status }}
      primary_linux_dispatch: ${{ steps.classify.outputs.primary_linux_dispatch }}
      nvidia_linux_status: ${{ steps.classify.outputs.nvidia_linux_status }}
      nvidia_linux_dispatch: ${{ steps.classify.outputs.nvidia_linux_dispatch }}
      amd_linux_status: ${{ steps.classify.outputs.amd_linux_status }}
      amd_linux_dispatch: ${{ steps.classify.outputs.amd_linux_dispatch }}
      intel_windows_status: ${{ steps.classify.outputs.intel_windows_status }}
      intel_windows_dispatch: ${{ steps.classify.outputs.intel_windows_dispatch }}
      apple_macos_status: ${{ steps.classify.outputs.apple_macos_status }}
      apple_macos_dispatch: ${{ steps.classify.outputs.apple_macos_dispatch }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect Exact Repository Runner Inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .genesis/ci-control-plane
          inventory_status=not-requested
          printf '{"total_count":0,"runners":[]}\n' \
            > .genesis/ci-control-plane/runner-inventory.json
          if [[ "$GENESIS_GPU_PACK" != "none" ]]; then
            inventory_status=ok
            if ! gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              > .genesis/ci-control-plane/runner-inventory.json; then
              inventory_status=api-unavailable
              printf '{"total_count":0,"runners":[]}\n' \
                > .genesis/ci-control-plane/runner-inventory.json
            fi
          fi
          echo "GENESIS_RUNNER_INVENTORY_STATUS=$inventory_status" >> "$GITHUB_ENV"

      - name: Classify Exact Runner Readiness
        id: classify
        shell: bash
        run: |
          python3 scripts/lib/ci_runner_preflight.py classify \
            --policy policies/ci_control_plane_v0.1.json \
            --inventory .genesis/ci-control-plane/runner-inventory.json \
            --inventory-status "$GENESIS_RUNNER_INVENTORY_STATUS" \
            --selection "$GENESIS_GPU_PACK" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --out .genesis/ci-control-plane/runner-preflight.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload Runner Preflight Disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-runner-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .genesis/ci-control-plane/runner-preflight.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Requested Runner Readiness
        run: |
          python3 scripts/lib/ci_runner_preflight.py verify \
            --report .genesis/ci-control-plane/runner-preflight.json

  release_target_reference_readiness:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: edge
            runner: ubuntu-24.04
          - target: ios
            runner: macos-15
          - target: service-runtime
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Reference Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - name: Install Reference Wasmtime
        if: ${{ matrix.target == 'edge' }}
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 36.0.9
      - name: Enable Android KVM
        if: ${{ matrix.target == 'android' }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android Reference Emulator
        if: ${{ matrix.target == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/prepare_release_target_reference.sh android "$GITHUB_ENV"
      - name: Prepare Named Reference Infrastructure
        if: ${{ matrix.target != 'android' }}
        shell: bash
        run: bash scripts/prepare_release_target_reference.sh "${{ matrix.target }}" "$GITHUB_ENV"
      - name: Classify Named Target Readiness
        shell: bash
        env:
          GENESIS_GCPM_TARGET_RUNTIME_EVIDENCE_DIR: .genesis/perf/reference-target-${{ matrix.target }}
          GENESIS_GCPM_TARGET_RUNTIME_EVIDENCE_REPORT: .genesis/perf/reference-target-${{ matrix.target }}.json
          GENESIS_GCPM_TARGET_RUNTIME_EXPECT_OUTCOME: unsupported-product
          GENESIS_GCPM_TARGET_RUNTIME_REQUIRE_NON_SYNTHETIC: "1"
          GENESIS_GCPM_TARGET_RUNTIME_REQUIRE_REFERENCE_SETUP: "1"
          GENESIS_GCPM_TARGET_RUNTIME_RUNNER_LABEL: ${{ matrix.runner }}
          GENESIS_GCPM_TARGET_RUNTIME_TARGETS: ${{ matrix.target }}
        run: bash scripts/update_gcpm_target_runtime_pipelines_report.sh
      - name: Upload Named Target Readiness
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-target-readiness-${{ matrix.target }}
          path: |
            .genesis/perf/reference-target-${{ matrix.target }}.json
            .genesis/perf/reference-target-${{ matrix.target }}/
          if-no-files-found: warn

  release_full_measurement:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full') }}
    needs: release_target_reference_readiness
    runs-on: ubuntu-24.04
    # The producer owns a 50-minute session deadline and needs time to terminate,
    # reap, retain diagnostics, and upload before the 60-minute watchdog.
    timeout-minutes: 55
    env:
      GENESIS_AGENT_GPU_PROFILE: agent-gpu-fallback
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"
      - name: Cache WASI SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/genesis/wasi-sdk
          key: wasi-sdk-33.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install Verified WASI SDK
        run: |
          bash scripts/install_wasi_sdk.sh \
            --install-base "$RUNNER_TOOL_CACHE/genesis/wasi-sdk" \
            --github-env "$GITHUB_ENV"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.137
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 36.0.9
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JS Dependencies
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-fund --no-audit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Fetch Offline Gate Dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path tools/genesis-evidence-producer/Cargo.toml --locked
          cargo fetch --manifest-path tools/genesis-evidence-verifier/Cargo.toml --locked
      - name: Download Named Target Readiness
        uses: actions/download-artifact@v4
        with:
          pattern: release-target-readiness-*
          path: .genesis/reference-targets
          merge-multiple: true
      - name: Paired Cold/Warm Release Measurement
        run: |
          bash scripts/measure_release_full_profile.sh \
            .genesis/perf/release-full-measurement \
            .genesis/reference-targets/reference-target-android.json \
            .genesis/reference-targets/reference-target-edge.json \
            .genesis/reference-targets/reference-target-ios.json \
            .genesis/reference-targets/reference-target-service-runtime.json \
            --pairs 2
      - name: Upload Release Measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-full-measurement
          path: .genesis/perf/release-full-measurement/
          if-no-files-found: error

  test_suite:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')) && 45 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')) && '["governance","runtime","platform"]' || '["standard"]') }}
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
      # GitHub-hosted CPU runners must select the reviewed fallback profile explicitly.
      GENESIS_AGENT_GPU_PROFILE: "agent-gpu-fallback"
      GENESIS_CI_PROFILE: ${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && github.event.inputs.profile || github.event_name == 'pull_request' && 'standard' || 'fast' }}
      GENESIS_CI_LANE: ${{ matrix.lane }}
      GENESIS_TEST_SHARDS_TOTAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_shards_total || '1' }}
      GENESIS_TEST_SHARD_INDEX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_shard_index || '0' }}
    steps:
      - uses: actions/checkout@v4
        # GenesisBench verifies frozen parent snapshots and must fail closed if history is absent.
        with:
          fetch-depth: 0

      - name: Resolve CI Profile
        run: |
          case "${GENESIS_CI_PROFILE}" in
            fast|standard|full) ;;
            *)
              echo "unsupported GENESIS_CI_PROFILE=${GENESIS_CI_PROFILE}"
              exit 1
              ;;
          esac
          echo "CI profile: ${GENESIS_CI_PROFILE}"
          if [[ "${GENESIS_CI_PROFILE}" == "full" ]]; then
            case "${GENESIS_CI_LANE}" in
              governance|runtime|platform) ;;
              *)
                echo "full CI requires governance, runtime, or platform lane; got ${GENESIS_CI_LANE}"
                exit 1
                ;;
            esac
          elif [[ "${GENESIS_CI_LANE}" != "standard" ]]; then
            echo "non-full CI requires standard lane; got ${GENESIS_CI_LANE}"
            exit 1
          fi
          echo "CI lane: ${GENESIS_CI_LANE}"
          [[ "${GENESIS_TEST_SHARDS_TOTAL}" =~ ^[0-9]+$ ]] || {
            echo "GENESIS_TEST_SHARDS_TOTAL must be numeric"
            exit 1
          }
          [[ "${GENESIS_TEST_SHARD_INDEX}" =~ ^[0-9]+$ ]] || {
            echo "GENESIS_TEST_SHARD_INDEX must be numeric"
            exit 1
          }
          if [[ "${GENESIS_TEST_SHARDS_TOTAL}" -lt 1 ]]; then
            echo "GENESIS_TEST_SHARDS_TOTAL must be >= 1"
            exit 1
          fi
          if [[ "${GENESIS_TEST_SHARD_INDEX}" -ge "${GENESIS_TEST_SHARDS_TOTAL}" ]]; then
            echo "GENESIS_TEST_SHARD_INDEX must be < GENESIS_TEST_SHARDS_TOTAL"
            exit 1
          fi
          echo "Test shard: ${GENESIS_TEST_SHARD_INDEX}/${GENESIS_TEST_SHARDS_TOTAL}"

          source scripts/lib/agent_gpu_profile_contract.sh
          genesis_apply_agent_gpu_profile_contract "${GENESIS_CI_PROFILE}" 1
          {
            echo "HEALTH_GPU_BACKEND_POLICY_DEFAULT=${HEALTH_GPU_BACKEND_POLICY_DEFAULT}"
            echo "GENESIS_HEALTH_GPU_BACKEND_POLICY_DEFAULT=${GENESIS_HEALTH_GPU_BACKEND_POLICY_DEFAULT}"
            echo "GENESIS_GPU_COMPUTE_BACKEND_POLICY=${GENESIS_GPU_COMPUTE_BACKEND_POLICY}"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache WASI SDK
        if: ${{ env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/genesis/wasi-sdk
          key: wasi-sdk-33.0-x86_64-linux-sha256-0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce

      - name: Install Verified WASI SDK
        if: ${{ env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full' }}
        run: |
          bash scripts/install_wasi_sdk.sh \
            --install-base "$RUNNER_TOOL_CACHE/genesis/wasi-sdk" \
            --github-env "$GITHUB_ENV"

      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.137

      - name: Install cargo-deny
        if: ${{ env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0

      - name: Fetch Offline Gate Dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path tools/genesis-evidence-producer/Cargo.toml --locked
          cargo fetch --manifest-path tools/genesis-evidence-verifier/Cargo.toml --locked

      - name: Prerequisite Manifest Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_prerequisite_manifest.sh

      - name: Reference Host Profile Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_reference_host_profiles.sh

      - name: Roadmap Workload Normalization Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_roadmap_workloads.sh

      - name: Signed Roadmap Baseline Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_roadmap_baseline.sh

      - name: Dependency Mirror Contract Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_dependency_mirror_contract.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: cargo fmt --all -- --check

      - name: Selfhost Boundary Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_selfhost_boundary.sh --strict

      - name: Rust Bootstrap Retirement Gate
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: |
          STRICT_RELEASE=1
          if [[ "${GENESIS_CI_PROFILE}" == "fast" ]]; then
            STRICT_RELEASE=0
          fi
          GENESIS_BOOTSTRAP_RETIREMENT_STRICT_RELEASE="$STRICT_RELEASE" \
            bash scripts/check_bootstrap_retirement_gate.sh

      - name: Host ABI Conformance Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_host_abi_conformance.sh

      - name: Runner High-Level Op Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_runner_high_level_op_guard.sh

      - name: Prelude Capability Coverage Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_prelude_capability_coverage.sh

      - name: Foundation Stdlib Conformance Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_foundation_stdlib_conformance.sh

      - name: Capability Indices Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_capability_indices.sh

      - name: Generated Artifact Policy Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_generated_artifact_policy.sh

      - name: Genesis Evidence Profile Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_genesis_evidence_profile.sh

      - name: Genesis Evidence Verifier Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_genesis_evidence_verifier.sh

      - name: Evidence Adversarial Matrix Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_evidence_adversarial_matrix.sh

      - name: Evidence Storage Classes Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_evidence_storage_classes.sh

      - name: Check Update Boundary Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_check_update_boundary.sh

      - name: Gate Resource Telemetry Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gate_resource_telemetry.sh

      - name: Deterministic Cleanup Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_deterministic_cleanup.sh

      - name: Gate Manifest Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gate_manifest.sh

      - name: Engineering Gate Budget Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_engineering_gate_contract.sh

      - name: Generated Release Notes Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_release_notes.sh

      - name: Versioning Release Hygiene Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_versioning_release_hygiene.sh

      - name: Version Surfaces Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_version_surfaces.sh

      - name: V1 Compatibility Registry Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_v1_compatibility.sh

      - name: Supply Chain Guard
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_supply_chain.sh

      - name: Release Smoke Gate
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_release_smoke.sh

      - name: Assurance Profile Pack Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_assurance_profile_packs.sh

      - name: Agent Authoring Bundle Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_agent_authoring_bundle.sh

      - name: GC Agent Profile Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gc_agent_profile.sh

      - name: GC Agent Core Card Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gc_agent_core_card.sh

      - name: GC Agent Task Cards Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gc_agent_task_cards.sh

      - name: GC Agent Symbol Index Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gc_agent_symbol_index.sh

      - name: GenesisCode Authoring Skill Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_genesiscode_authoring_skill.sh

      - name: Domain Kit Workflow Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_domain_kit_workflows.sh

      - name: Backend Starter Workflow Evidence
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/update_backend_starter_workflows_report.sh

      - name: Domain Starter Registry Bootstrap Evidence
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/update_domain_starter_registry_bootstrap_report.sh

      - name: Selfhost Refactor Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_selfhost_refactor_guard.sh

      - name: Selfhost Dashboard Freshness Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_selfhost_dashboard_fresh.sh

      - name: Red-Team Report Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_redteam_report.sh

      - name: User-Path Panic Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_no_user_panics.sh

      - name: User-Path Panic Compiler Assurance
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_no_user_panics_compiler.sh

      - name: Rust Engine Compatibility Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_rust_engine_compat.sh

      - name: Production CLI Parse Surface Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_production_cli_parse_surface.sh

      - name: Production CLI Help Surface Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_production_cli_help_surface.sh

      - name: CLI Diagnostics Contract Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_cli_diagnostics_contract.sh

      - name: Fuzz + Differential Hardening Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_fuzz_differential_hardening.sh

      - name: Test Execution Profile Matrix Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_test_execution_profile_matrix.sh

      - name: Changed Impact Contract Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_changed_impact.sh

      - name: Docs Quickstart Gate
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_docs_quickstart.sh

      - name: GPU Conformance Lane Matrix Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gpu_conformance_lane_matrix.sh

      - name: Source Size Budget Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_source_size_budget.sh

      - name: GC Source Size Budget Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_gc_source_size_budget.sh

      - name: Test Size Budget Guard
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'governance') }}
        run: bash scripts/check_test_size_budget.sh

      - name: Clippy
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'runtime') }}
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Runtime Backend Feature Matrix Guard
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'runtime') }}
        run: bash scripts/update_runtime_backend_feature_matrix_report.sh

      - name: Test
        if: ${{ (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'runtime') }}
        run: |
          source scripts/lib/cargo_target_dir.sh
          genesis_configure_cargo_target_dir "$PWD" "workspace-test" root-host
          trap 'genesis_clear_resolved_cargo_target_dir "workspace-test-exit"' EXIT
          if [[ "${GENESIS_CI_PROFILE}" == "fast" ]]; then
            bash scripts/test_fast.sh
          elif [[ "${GENESIS_TEST_SHARDS_TOTAL}" -gt 1 ]]; then
            bash scripts/test_shard_workspace.sh \
              --total "${GENESIS_TEST_SHARDS_TOTAL}" \
              --index "${GENESIS_TEST_SHARD_INDEX}" \
              --seed "${GITHUB_SHA}" \
              --out ".genesis/ci-shards" \
              --runner nextest
          else
            cargo nextest run \
              --workspace \
              --cargo-profile selfhost-strict \
              --profile ci
          fi

      - name: Changed-File Fast Loop Budget
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'runtime') }}
        run: |
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # The standard PR job already executes the full selected gate and test
            # surface. Validate impact planning without repeating that cold work.
            bash scripts/test_changed_fast.sh \
              --base "$BASE" \
              --runner nextest \
              --min-history 1 \
              --dry-run
          elif [[ -n "$BASE" ]]; then
            bash scripts/test_changed_fast.sh --base "$BASE" --runner nextest --min-history 1
          else
            bash scripts/test_changed_fast.sh --runner nextest --min-history 1
          fi

      - name: Install Node (Release Evidence + WASM)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS Deps (Playwright Release Evidence)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-fund --no-audit

      - name: Install Playwright Chromium (Release Evidence)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: npx playwright install --with-deps chromium

      - name: Ignored Perf Gate Regression Tests
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          if [[ "$GENESIS_CI_PROFILE" == "full" ]]; then
            GENESIS_HEALTH_PROFILE=release-full \
              bash scripts/test_perf_gates.sh --exclude-test upgrade_plan_health
          else
            # Keep the 360s local warm-cache target; hosted regression runs disable
            # the nested health cache and need an explicit cold-run envelope.
            GENESIS_HEALTH_DEV_FAST_WALL_BUDGET_MS=420000 \
              GENESIS_HEALTH_PROFILE=dev-fast \
              bash scripts/test_perf_gates.sh
          fi

      - name: Upload Test Shard Artifacts
        if: ${{ (always() && env.GENESIS_TEST_SHARDS_TOTAL != '1') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'runtime') }}
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ env.GENESIS_TEST_SHARD_INDEX }}-of-${{ env.GENESIS_TEST_SHARDS_TOTAL }}
          path: .genesis/ci-shards/
          if-no-files-found: error

      - name: Performance Budgets
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_perf_budgets_report.sh

      - name: AI Iteration SLO
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          if [[ "$GENESIS_CI_PROFILE" == "full" ]]; then
            bash scripts/update_ai_iteration_slo_report.sh
          else
            # Preserve the 15s local/full target while allowing bounded hosted jitter.
            GENESIS_BUDGET_CHANGED_FAST_MS=20000 \
              bash scripts/update_ai_iteration_slo_report.sh
          fi

      - name: AI Stress Suite (Tasks + Bridge + GPU/Compute)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_ai_stress_suite_report.sh

      - name: Hot Path Budgets
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_hot_path_budgets_report.sh

      - name: Runtime Microbench Budgets
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_runtime_microbench_budgets_report.sh

      - name: Runtime Workload Budgets
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_runtime_workload_budgets_report.sh

      - name: GPU Compute Runtime Profile (Compute-Only)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_gpu_compute_runtime_profile_report.sh

      - name: Selfhost Strict Smoke (Native + WASI CLI)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/selfhost_strict_smoke.sh

      - name: Agent Capability Gauntlet (Selfhost-Only)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          bash scripts/update_agent_reference_workflows_report.sh
          if [[ "$GENESIS_CI_PROFILE" == "full" ]]; then
            bash scripts/update_agent_workflow_runtime_parity_report.sh
          fi

      - name: Agent End-to-End Scenario Perf Gate
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_agent_scenario_perf_report.sh

      - name: Agent Generative Workload Gate
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          if [[ "$GENESIS_CI_PROFILE" == "full" ]]; then
            GENESIS_AGENT_GENERATIVE_PRIMARY_REPORT=.genesis/perf/agent_capability_gauntlet_native_report.json \
              GENESIS_AGENT_GENERATIVE_SECONDARY_REPORT=.genesis/perf/agent_capability_gauntlet_wasi_report.json \
              GENESIS_AGENT_GENERATIVE_REQUIRE_SECONDARY=1 \
              bash scripts/update_agent_generative_workloads_report.sh
          else
            GENESIS_AGENT_GENERATIVE_PRIMARY_REPORT=.genesis/perf/agent_capability_gauntlet_report.json \
              GENESIS_AGENT_GENERATIVE_REQUIRE_SECONDARY=0 \
              bash scripts/update_agent_generative_workloads_report.sh
          fi

      - name: Upload Perf Trend Artifacts
        if: ${{ (always() && (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full')) && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-trend-artifacts
          path: |
            .genesis/perf/*.json
            .genesis/perf/*.jsonl
          if-no-files-found: warn

      - name: Selfhost Strict Golden (Native + WASI CLI)
        if: ${{ (env.GENESIS_CI_PROFILE == 'full' && github.event_name != 'pull_request') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/selfhost_strict_golden.sh

      - name: WASM Build (Pure Kernel)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          source scripts/lib/cargo_target_dir.sh
          genesis_configure_cargo_target_dir "$PWD" ci-wasm-build root-wasm
          cargo build -p gc_wasm --target wasm32-unknown-unknown

      - name: Prepare Content-Addressed Dependency Mirror
        if: ${{ (env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          mirror="$(bash scripts/update_dependency_mirror.sh --format path)"
          echo "GENESIS_DEPENDENCY_MIRROR=${mirror}" >> "$GITHUB_ENV"

      - name: Clean Offline Build With Hard Network Denial
        if: ${{ (env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/test_offline_dependency_mirror.sh --mirror "$GENESIS_DEPENDENCY_MIRROR"

      - name: Install wasm-bindgen-cli
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: WASM Bindings (Node) + Smoke Test
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          wasm_js_path="$(bash scripts/wasm_bindgen_node.sh | tail -n 1)"
          node scripts/wasm_node_smoke.mjs "$wasm_js_path"

      - name: WASM Cross-Host Determinism (Native vs Node)
        if: ${{ (env.GENESIS_CI_PROFILE == 'full' && github.event_name != 'pull_request') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          wasm_js_path="$(bash scripts/wasm_bindgen_node.sh | tail -n 1)"
          node scripts/wasm_cross_host_determinism.mjs "$wasm_js_path"

      - name: Full Cross-Host Runtime Budget Gate
        if: ${{ (env.GENESIS_CI_PROFILE == 'full' && github.event_name != 'pull_request') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: bash scripts/update_full_cross_host_profile_budget_report.sh

      - name: WASM Bindings (Web) + Headless Browser Smoke
        if: ${{ (env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          bash scripts/wasm_bindgen_web.sh >/dev/null
          node scripts/wasm_web_smoke.mjs

      - name: Install wasmtime
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 36.0.9

      - name: WASI Build + Smoke (genesis_wasi.wasm)
        if: ${{ (env.GENESIS_CI_PROFILE == 'standard' || env.GENESIS_CI_PROFILE == 'full') && (env.GENESIS_CI_LANE == 'standard' || env.GENESIS_CI_LANE == 'platform') }}
        run: |
          bash scripts/install_wasi_sdk.sh --version
          source scripts/lib/cargo_target_dir.sh
          genesis_configure_cargo_target_dir "$PWD" ci-wasi-smoke-native root-host
          cargo build -p gc_cli --bin genesis --locked --offline
          native_smoke_bin="$RUNNER_TEMP/genesis-wasi-smoke-native"
          cp "$CARGO_TARGET_DIR/debug/genesis" "$native_smoke_bin"
          chmod 0755 "$native_smoke_bin"
          genesis_configure_cargo_target_dir "$PWD" ci-wasi-build root-wasi
          cargo build -p gc_wasi_cli --target wasm32-wasip1 --release --locked --offline
          GENESIS_WASI_SMOKE_NATIVE_BIN="$native_smoke_bin" \
            bash scripts/wasi_smoke.sh "$CARGO_TARGET_DIR/wasm32-wasip1/release/genesis_wasi.wasm"

  local_workspace_test_contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'fast') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
    steps:
      - uses: actions/checkout@v4
        # GenesisBench resolves frozen parent snapshots during workspace tests.
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Local Workspace Disk Headroom
        run: bash scripts/check_disk_headroom.sh --path "$PWD" --context "local-workspace-test-contract" --min-kb 10485760 --strict 1

      - name: Fetch Locked Workspace Dependencies
        run: cargo fetch --locked

      - name: Local Workspace Test Contract (CI unset)
        run: env -u CI cargo test --workspace --profile selfhost-strict --locked --offline

  test:
    if: ${{ always() }}
    needs:
      - test_suite
      - local_workspace_test_contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required CI Aggregate
        env:
          TEST_SUITE_RESULT: ${{ needs.test_suite.result }}
          LOCAL_WORKSPACE_RESULT: ${{ needs.local_workspace_test_contract.result }}
          LOCAL_WORKSPACE_REQUIRED: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile != 'fast')) && '1' || '0' }}
        run: |
          [[ "$TEST_SUITE_RESULT" == "success" ]] || {
            echo "test_suite result: $TEST_SUITE_RESULT" >&2
            exit 1
          }
          if [[ "$LOCAL_WORKSPACE_REQUIRED" == "1" ]]; then
            [[ "$LOCAL_WORKSPACE_RESULT" == "success" ]] || {
              echo "required local_workspace_test_contract result: $LOCAL_WORKSPACE_RESULT" >&2
              exit 1
            }
          else
            [[ "$LOCAL_WORKSPACE_RESULT" == "skipped" || "$LOCAL_WORKSPACE_RESULT" == "success" ]] || {
              echo "optional local_workspace_test_contract result: $LOCAL_WORKSPACE_RESULT" >&2
              exit 1
            }
          fi

  pr_strict_equivalence_gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Selfhost Strict Golden (PR Required)
        run: bash scripts/selfhost_strict_golden.sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: WASM Cross-Host Determinism (PR Required)
        run: |
          wasm_js_path="$(bash scripts/wasm_bindgen_node.sh | tail -n 1)"
          node scripts/wasm_cross_host_determinism.mjs "$wasm_js_path"

      - name: Full Cross-Host Runtime Budget Gate (PR Required)
        run: bash scripts/update_full_cross_host_profile_budget_report.sh

  webxr_browser_conformance:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS Deps (Playwright)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-fund --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser-Native WebXR Conformance (Deterministic Capture/Replay)
        run: bash scripts/update_webxr_browser_conformance_report.sh

      - name: Upload WebXR Browser Conformance Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webxr-browser-conformance-artifacts
          path: .genesis/perf/webxr_browser_conformance_report.json
          if-no-files-found: warn

  gpu_device_microbench:
    if: ${{ !cancelled() && needs.gpu_runner_preflight.outputs.primary_linux_dispatch == 'true' }}
    needs: gpu_runner_preflight
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
      GENESIS_RUNTIME_MICROBENCH_FEATURES: "device-bridge"
      GENESIS_GPU_COMPUTE_BACKEND_POLICY: "require-device"
      GENESIS_RUNTIME_MICROBENCH_REQUIRED_GPU_BACKEND: "device-runtime"
      GENESIS_GPU_DEVICE_CONFORMANCE_OUT_DIR: ".genesis/perf/gpu_device_conformance"
      GENESIS_GPU_DEVICE_CONFORMANCE_REPORT_OUT: ".genesis/perf/gpu_device_conformance_report.json"
      GENESIS_BUDGET_MICRO_GPU_COMPUTE_SUBMIT_MS_DEVICE: "5000"
      GENESIS_BUDGET_MICRO_GPU_COMPUTE_SUBMIT_MS_FALLBACK: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Device Bridge Replay Determinism (Feature Gate)
        run: cargo test -p gc_runtime_bench --features device-bridge --test device_bridge_replay --quiet

      - name: GPU Device Conformance Lane (Require Device Backend)
        run: bash scripts/update_gpu_compute_device_conformance_report.sh

      - name: Upload GPU Perf Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-device-conformance-artifacts-selfhosted-linux
          path: |
            .genesis/perf/gpu_device_conformance/
            .genesis/perf/gpu_device_conformance_report.json
          if-no-files-found: warn

  gpu_device_microbench_deterministic:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GENESIS_ALLOW_RUST_ENGINE: "0"
      GENESIS_GPU_DEVICE_CONFORMANCE_OUT_DIR: ".genesis/perf/gpu_device_conformance_deterministic"
      GENESIS_GPU_DEVICE_CONFORMANCE_REPORT_OUT: ".genesis/perf/gpu_device_conformance_deterministic_report.json"
      GENESIS_GPU_DEVICE_CONFORMANCE_FEATURES: ""
      GENESIS_GPU_COMPUTE_BACKEND_POLICY: "require-device"
      GENESIS_GPU_COMPUTE_DEVICE_RUNTIME_CMD: "${{ github.workspace }}/scripts/gpu_device_runtime_deterministic.sh"
      GENESIS_RUNTIME_MICROBENCH_REQUIRED_GPU_BACKEND: "device-runtime"
      GENESIS_BUDGET_MICRO_GPU_COMPUTE_SUBMIT_MS_DEVICE: "5000"
      GENESIS_BUDGET_MICRO_GPU_COMPUTE_SUBMIT_MS_FALLBACK: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0

      - name: Resolve Cargo Cache
        shell: bash
        run: python3 scripts/lib/cargo_cache.py --root . --scope root-host --format github-env >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: GPU Device Conformance Lane (Deterministic Runner)
        run: bash scripts/update_gpu_compute_device_conformance_report.sh

      - name: Upload GPU Perf Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-device-conformance-artifacts-deterministic
          path: |
            .genesis/perf/gpu_device_conformance_deterministic/
            .genesis/perf/gpu_device_conformance_deterministic_report.json
          if-no-files-found: warn

  gpu_device_conformance_release_gate:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')) }}
    needs:
      - gpu_runner_preflight
      - gpu_device_microbench
      - gpu_device_microbench_deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download Runner Preflight Disposition
        uses: actions/download-artifact@v4
        with:
          name: ci-runner-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: .genesis/ci-control-plane

      - name: Enforce GPU Pack Disposition
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.gpu_runner_preflight.result }}
          PREFLIGHT_STATUS: ${{ needs.gpu_runner_preflight.outputs.primary_linux_status }}
          PRIMARY_RESULT: ${{ needs.gpu_device_microbench.result }}
          DETERMINISTIC_RESULT: ${{ needs.gpu_device_microbench_deterministic.result }}
        run: |
          [[ "$DETERMINISTIC_RESULT" == "success" ]] || {
            echo "deterministic GPU lane result: $DETERMINISTIC_RESULT" >&2
            exit 1
          }
          case "$PREFLIGHT_STATUS" in
            ready)
              [[ "$PREFLIGHT_RESULT" == "success" && "$PRIMARY_RESULT" == "success" ]] || {
                echo "required primary GPU lane did not succeed" >&2
                exit 1
              }
              ;;
            unsupported-profile)
              [[ "$PREFLIGHT_RESULT" == "success" && "$PRIMARY_RESULT" == "skipped" ]] || {
                echo "optional primary GPU disposition is inconsistent" >&2
                exit 1
              }
              echo "primary GPU pack unavailable by explicit non-claim"
              ;;
            infrastructure-failure)
              echo "requested primary GPU pack is unavailable" >&2
              exit 1
              ;;
            *)
              echo "unknown primary GPU preflight status: $PREFLIGHT_STATUS" >&2
              exit 1
              ;;
          esac

      - name: Download Self-Hosted GPU Lane Artifact
        if: ${{ needs.gpu_runner_preflight.outputs.primary_linux_status == 'ready' }}
        uses: actions/download-artifact@v4
        with:
          name: gpu-device-conformance-artifacts-selfhosted-linux
          path: .genesis/perf/lane_a

      - name: Download Deterministic GPU Lane Artifact
        uses: actions/download-artifact@v4
        with:
          name: gpu-device-conformance-artifacts-deterministic
          path: .genesis/perf/lane_b

      - name: GPU Device Conformance Lane Parity Gate
        if: ${{ needs.gpu_runner_preflight.outputs.primary_linux_status == 'ready' }}
        run: |
          bash scripts/update_gpu_device_conformance_lane_parity_report.sh \
            --lane-a .genesis/perf/lane_a/gpu_device_conformance_report.json \
            --lane-b .genesis/perf/lane_b/gpu_device_conformance_deterministic_report.json \
            --out .genesis/perf/gpu_device_lane_parity_report.json

      - name: Upload GPU Lane Parity Artifact
        if: ${{ always() && needs.gpu_runner_preflight.outputs.primary_linux_status == 'ready' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-device-conformance-lane-parity
          path: .genesis/perf/gpu_device_lane_parity_report.json
          if-no-files-found: warn

